aid: parsec-finance
name: Parsec Finance
description: 'Parsec Finance is an institutional-grade on-chain analytics platform for DeFi and NFT
  markets. Its modular "Command Center" lets traders and analysts drag and drop dozens of real-time
  components — live trade firehoses, liquidity-depth charts, wallet trackers, lending dashboards and
  NFT floor monitors — across many EVM chains. Beyond the app, Parsec exposes a Pro GraphQL API at
  api.parsec.finance for programmatic access to on-chain market data: DEX trades, OHLCV candles,
  lending markets, liquidity pools (including concentrated-liquidity positions), NFT collections and
  trades, token holders and balance changes, transfers, transactions, contract logs, trending
  contracts, trade metrics and address label resolution. A first-party Python SDK (parsecfi) wraps
  the API. Parsec is used by firms such as Polychain and Galaxy Digital.'
